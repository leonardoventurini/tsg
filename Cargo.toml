[package]
name = "tsg"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Transactional semantic graph storage engine"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
usearch = "2.16"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

