name: Release package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Validate release tag
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tsg") | .version')"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}" >&2
            exit 1
          fi

      - name: Test package
        run: cargo test --all-targets --all-features --locked

      - name: Build package
        run: cargo package --locked

      - name: Create checksum
        run: |
          cd target/package
          sha256sum tsg-*.crate > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/package/tsg-*.crate \
            target/package/SHA256SUMS \
            --generate-notes \
            --title "TSG ${GITHUB_REF_NAME}" \
            --verify-tag
